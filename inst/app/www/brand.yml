meta:
  name: 
    full: Coral Reef Alliance
    short: CORAL
  links:
    home: https://coral.org/en/
  description:
    The Coral Reef Alliance (CORAL) is a registered non-profit working at local,
    regional, and global levels to keep coral reefs healthy, so they can adapt 
    to climate change and survive for generations to come. As one of the largest
    global NGOs focused exclusively on protecting coral reefs, the Coral Reef 
    Alliance (CORAL) has used cutting-edge science and community engagement for 
    nearly 30 years to reduce direct threats to reefs and to promote scalable 
    and effective solutions for their protection.

logo:
  images:
    icon-color: CORAL Logo_ColorSquare_notext.png
    icon-white: CORAL Logo_WhiteSquare_notext.png
    logo-color: CORAL Logo_ColorSquare.png
    logo-white: CORAL Logo_WhiteSquare.png
    logo-wide-color: CORAL Logo_ColorHorizontal.png
  small: icon-color
  medium: 
    light: logo-color
    dark: logo-white
  large: logo-wide-color

